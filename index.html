<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SweetAlert2 Library -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-lg border border-emerald-500/20">
                    <i class="fa-solid fa-chart-line text-xl"></i>
                </div>
                <span class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-200 bg-clip-text text-transparent">
                    Stock Market Tracker
                </span>
            </div>
                        
            <div id="auth-section" class="flex items-center gap-3">
                <div id="connection-status" class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Connecting...
                </div>

                <button id="open-auth-btn" onclick="toggleModal('auth-modal')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-semibold transition-all">
                    <i class="fa-solid fa-user mr-1.5"></i> Login / Register
                </button>

                <div id="user-info-container" class="hidden flex items-center gap-3">
                    <span id="user-display" class="text-sm font-semibold text-slate-200"></span>
                    <button onclick="logout()" class="px-3 py-1.5 bg-red-600/20 hover:bg-red-600/40 text-red-400 rounded-lg text-xs font-bold border border-red-500/30 transition-all">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">

        <!-- Logged Out Alert Notice -->
        <div id="logged-out-notice" class="bg-slate-900 border border-slate-800 rounded-xl p-8 text-center shadow-xl my-12">
            <i class="fa-solid fa-lock text-4xl text-emerald-500/40 mb-3"></i>
            <h2 class="text-xl font-bold text-slate-200 mb-2">Access Restricted</h2>
            <p class="text-slate-400 text-sm mb-4">Please log in to view the live stock market feed and real-time updates.</p>
            <button onclick="toggleModal('auth-modal')" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-bold transition-all">
                Login Now
            </button>
        </div>

        <!-- Main Dashboard Container -->
        <div id="dashboard-container">

            <!-- Admin Add Stock Card -->
            <div id="add-stock-card" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-5 mb-8 shadow-xl">
                <div class="text-emerald-400 font-bold mb-4 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved"></i> Add New Stock (Admin Only)
                </div>
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                    <input type="text" id="stock-symbol" placeholder="Symbol (e.g. AAPL)" autocomplete="off" class="md:col-span-2 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 uppercase focus:outline-none focus:border-emerald-500">
                    <input type="number" id="stock-price" placeholder="Initial Price ($)" autocomplete="off" class="md:col-span-2 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
                    <button onclick="addStock()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg py-2.5 transition-all">Add Stock</button>
                </div>
            </div>

            <!-- Admin Create New Admin Card -->
            <div id="add-admin-card" class="hidden bg-slate-900 border border-slate-800 rounded-xl p-5 mb-8 shadow-xl">
                <div class="text-emerald-400 font-bold mb-4 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-user-shield"></i> Create New Admin (Admin Only)
                </div>
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                    <input type="text" id="admin-username" placeholder="New Admin Username" autocomplete="off" class="md:col-span-2 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
                    <input type="password" id="admin-password" placeholder="New Admin Password" autocomplete="off" class="md:col-span-2 bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
                    <button onclick="createAdmin()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg py-2.5 transition-all">Create Admin</button>
                </div>
            </div>

            <!-- Tabs Navigation -->
            <div id="tabs-container" class="flex items-center gap-2 mb-4">
                <button id="tab-all-btn" onclick="switchTab('all')" class="px-4 py-2 text-xs font-bold rounded-lg bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 transition-all">
                    <i class="fa-solid fa-globe mr-1.5"></i> All Stocks
                </button>
                <button id="tab-watchlist-btn" onclick="switchTab('watchlist')" class="px-4 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all">
                    <i class="fa-solid fa-star mr-1.5"></i> My Watchlist
                </button>
            </div>

            <!-- Summary, Export & Search Section -->
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-6">
                <div class="flex items-center gap-2 text-sm text-slate-400">
                    <span>Total Stocks Tracked:</span>
                    <span id="total-stocks-count" class="font-bold text-emerald-400 text-base">0</span>
                </div>

                <div class="flex items-center gap-3 w-full md:w-auto">
                    <!-- Export CSV Button -->
                    <button onclick="exportToCSV()" class="px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-slate-200 border border-slate-800 hover:border-slate-700 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-file-csv text-emerald-400 text-base"></i> Export CSV
                    </button>

                    <!-- Search Bar -->
                    <div class="relative w-full md:w-72">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-sm"></i>
                        <input type="text" id="search-stock-input" onkeyup="filterStocks()" autocomplete="off" name="search_stock_field" placeholder="Search stock symbol..." 
                            class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-10 pr-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
            </div>

            <!-- Stocks Table -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                <table class="w-full text-left">
                    <thead class="bg-slate-950/60 text-slate-400 text-xs uppercase border-b border-slate-800">
                        <tr>
                            <th class="py-4 px-6">Symbol</th>
                            <th class="py-4 px-6">Current Price</th>
                            <th class="py-4 px-6 text-emerald-400"><i class="fa-solid fa-arrow-trend-up mr-1"></i> 24h High</th>
                            <th class="py-4 px-6 text-rose-400"><i class="fa-solid fa-arrow-trend-down mr-1"></i> 24h Low</th>
                            <th class="py-4 px-6 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="stocks-table-body" class="divide-y divide-slate-800/60 text-sm"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal: Authentication -->
    <div id="auth-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl max-w-sm w-full p-6 relative shadow-2xl">
            <button onclick="toggleModal('auth-modal')" class="absolute right-4 top-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 class="text-xl font-bold mb-4 text-emerald-400">Sign In / Register</h3>
            <div class="space-y-4">
                <input type="text" id="auth-username" autocomplete="username" placeholder="Username" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
                <input type="password" id="auth-password" autocomplete="current-password" placeholder="Password" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-slate-100 focus:outline-none focus:border-emerald-500">
                <div class="flex gap-2">
                    <button onclick="login()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg transition-all">Login</button>
                    <button onclick="register()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 rounded-lg border border-slate-700 transition-all">Register</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Stock Chart -->
    <div id="chart-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-2xl shadow-2xl relative">
            <button onclick="toggleModal('chart-modal')" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 id="chart-stock-symbol" class="text-xl font-bold text-emerald-400 mb-4">Stock Live Chart</h3>
            <div class="w-full h-64">
                <canvas id="stockHistoryChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.12/signalr.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
