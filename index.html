<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابع الأسهم اللحظي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="#">Stock Market Tracker</a>
            
            <div id="auth-section">
                <div id="login-form-container" class="d-flex gap-2 align-items-center">
                    <input type="text" id="auth-username" class="form-control form-control-sm" placeholder="اسم المستخدم">
                    <input type="password" id="auth-password" class="form-control form-control-sm" placeholder="كلمة المرور">
                    <button onclick="login()" class="btn btn-primary btn-sm px-3">دخول</button>
                    <button onclick="register()" class="btn btn-outline-light btn-sm">حساب جديد</button>
                </div>

                <div id="user-info-container" class="d-none">
                    <span id="user-display" class="text-white me-3 fw-bold"></span>
                    <button onclick="logout()" class="btn btn-danger btn-sm">خروج</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="add-stock-card" class="card shadow-sm mb-4 border-0 d-none">
            <div class="card-header bg-primary text-white fw-bold">إضافة سهم جديد (أدمن فقط)</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-5">
                        <input type="text" id="stock-symbol" class="form-control" placeholder="رمز السهم (مثل: AAPL)">
                    </div>
                    <div class="col-md-5">
                        <input type="number" id="stock-price" class="form-control" placeholder="السعر">
                    </div>
                    <div class="col-md-2">
                        <button onclick="addStock()" class="btn btn-success w-100 fw-bold">إضافة</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white fw-bold d-flex justify-content-between">
                <span>قائمة الأسهم</span>
                <span class="badge bg-danger">مباشر 🔴</span>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0 text-center align-middle">
                    <thead class="table-secondary">
                        <tr>
                            <th>الرمز</th>
                            <th>السعر الحالي</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="stocks-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.12/signalr.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
